      - coin-server
    environment:
      REDIS_HOST: redis
      PG_DSN: "postgresql://aqm_user:${AQM_DB_PASSWORD:-aqm_prod_password}@postgres:5432/aqm"
      AQM_CONTACT_HOST_TEMPLATE: docker
      AQM_PASSWORD: "${AQM_PROTYASHA_PASSWORD:-aqm-demo-2026}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_PROTYASHA:-change-me-protyasha}"

  shirsa:
