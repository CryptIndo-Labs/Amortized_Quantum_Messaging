      --user shirsa --port 5002 --host 0.0.0.0
      --contacts biprarshi protyasha subhamoy samrat padma shreejith --contact-ports 5000 5001 5003 5004 5005 5006
    depends_on:
      - coin-server
    environment:
      REDIS_HOST: redis
      PG_DSN: "postgresql://aqm_user:${AQM_DB_PASSWORD:-aqm_prod_password}@postgres:5432/aqm"
      AQM_CONTACT_HOST_TEMPLATE: docker
      AQM_PASSWORD: "${AQM_SHIRSA_PASSWORD:-aqm-demo-2026}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_SHIRSA:-change-me-shirsa}"

