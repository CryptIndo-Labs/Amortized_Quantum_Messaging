services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aqm
      POSTGRES_USER: aqm_user
      POSTGRES_PASSWORD: "${AQM_DB_PASSWORD:-aqm_prod_password}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./AQM_Database/aqm_server/migrations:/docker-entrypoint-initdb.d

  coin-server:
    build: .
    restart: unless-stopped
    command: >
      uvicorn AQM_Database.aqm_server.api:app
      --host 0.0.0.0 --port 8000
    depends_on:
      - redis
      - postgres
    environment:
      REDIS_HOST: redis
      PG_DSN: "postgresql://aqm_user:${AQM_DB_PASSWORD:-aqm_prod_password}@postgres:5432/aqm"

  biprarshi:
    build: .
    restart: unless-stopped
    command: >
      python -m AQM_Database.flask_app.app
      --user biprarshi --port 5000 --host 0.0.0.0
      --contacts protyasha shirsa subhamoy samrat padma shreejith --contact-ports 5001 5002 5003 5004 5005 5006
    depends_on:
      - coin-server
    environment:
      REDIS_HOST: redis
      PG_DSN: "postgresql://aqm_user:${AQM_DB_PASSWORD:-aqm_prod_password}@postgres:5432/aqm"
      AQM_CONTACT_HOST_TEMPLATE: docker
      AQM_PASSWORD: "${AQM_BIPRARSHI_PASSWORD:-aqm-demo-2026}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_BIPRARSHI:-change-me-biprarshi}"

  protyasha:
    build: .
    restart: unless-stopped
    command: >
      python -m AQM_Database.flask_app.app
      --user protyasha --port 5001 --host 0.0.0.0
      --contacts biprarshi shirsa subhamoy samrat padma shreejith --contact-ports 5000 5002 5003 5004 5005 5006
